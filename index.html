    <style>
      /* Islamic Typography & Styling Fixes */
      .font-arabic,
      [data-arabic="true"] {
        font-family: 'Amiri', 'Scheherazade New', 'Traditional Arabic', serif !important;
        letter-spacing: 0 !important;
        word-spacing: normal !important;
        line-height: 1.6 !important;
      }

      /* Ensure diyas and flame glows are completely removed */
      [code-path*="Hero.tsx:8:5"],
      [code-path*="Hero.tsx:14:7"],
      [code-path*="Hero.tsx:23:7"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      /* Fix cursive font flourishes getting cropped from top and bottom on mobile */
      .font-script {
        line-height: 1.38 !important;
        padding-top: 0.15em !important;
        padding-bottom: 0.22em !important;
        overflow: visible !important;
      }

      /* Hero Couple Names: prominent, royal, grand responsive sizing without cropping */
      .hero-couple-name {
        font-size: clamp(4.25rem, 20vw, 6.5rem) !important;
        line-height: 1.25 !important;
        padding-top: 0.1em !important;
        padding-bottom: 0.15em !important;
        overflow: visible !important;
        display: block !important;
        text-align: center !important;
      }

      .text-outline-gold {
        overflow: visible !important;
        line-height: 1.25 !important;
      }

      h1, h2, h3 {
        overflow: visible !important;
      }
      /* Event Card Header: prevent date from breaking out of box */
      .event-card-header {
        display: flex !important;
        flex-direction: column !important;
        gap: 0.25rem !important;
      }
      @media (min-width: 640px) {
        .event-card-header {
          flex-direction: row !important;
          align-items: baseline !important;
          justify-content: space-between !important;
          gap: 0.75rem !important;
        }
      }

      /* Background Music Controller */
      @keyframes bgmWave {
        0%, 100% { height: 4px; }
        50% { height: 14px; }
      }
      .bgm-bar {
        display: inline-block;
        width: 2.5px;
        background: #e8c874;
        border-radius: 2px;
      }
      .bgm-playing .bgm-bar:nth-child(1) { animation: bgmWave 0.8s ease-in-out infinite; }
      .bgm-playing .bgm-bar:nth-child(2) { animation: bgmWave 0.6s ease-in-out infinite 0.2s; }
      .bgm-playing .bgm-bar:nth-child(3) { animation: bgmWave 0.9s ease-in-out infinite 0.4s; }
      .bgm-paused .bgm-bar { height: 4px !important; }
      #bgm-btn:hover {
        transform: scale(1.05);
        border-color: rgba(217, 164, 65, 0.9);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), 0 0 22px rgba(217, 164, 65, 0.4);
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Floating Background Music Player -->
    <div id="bgm-player" style="position:fixed;bottom:22px;right:18px;z-index:9999;display:flex;align-items:center;">
      <button id="bgm-btn" type="button" aria-label="Toggle background music" style="
        display:flex;
        align-items:center;
        gap:8px;
        padding:9px 16px;
        background:rgba(22,4,8,0.88);
        border:1.5px solid rgba(217,164,65,0.65);
        border-radius:9999px;
        box-shadow:0 8px 24px rgba(0,0,0,0.5), 0 0 16px rgba(217,164,65,0.25);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
        cursor:pointer;
        font-family:ui-sans-serif,system-ui,sans-serif;
        font-size:11px;
        font-weight:600;
        letter-spacing:0.18em;
        text-transform:uppercase;
        color:#f6e2ae;
        transition:all 0.25s ease;
      ">
        <span id="bgm-icon" class="bgm-playing" style="display:inline-flex;align-items:flex-end;gap:2.5px;height:14px;width:14px;">
          <span class="bgm-bar" style="height:12px;"></span>
          <span class="bgm-bar" style="height:8px;"></span>
          <span class="bgm-bar" style="height:10px;"></span>
        </span>
        <span id="bgm-label">Music</span>
      </button>
      <audio id="bgm-audio" loop preload="auto" src="./editable/assets/bgm.mp3"></audio>
    </div>

    <script>
      (function() {
        const audio = document.getElementById('bgm-audio');
        const btn = document.getElementById('bgm-btn');
        const label = document.getElementById('bgm-label');
        const icon = document.getElementById('bgm-icon');
        if (!audio || !btn) return;

        audio.volume = 0.7;

        function setPlayingState(playing) {
          if (playing) {
            icon.className = 'bgm-playing';
            icon.innerHTML = '<span class="bgm-bar" style="height:12px;"></span><span class="bgm-bar" style="height:8px;"></span><span class="bgm-bar" style="height:10px;"></span>';
            label.textContent = 'Music';
            btn.setAttribute('aria-pressed', 'true');
          } else {
            icon.className = 'bgm-paused';
            icon.innerHTML = '<svg style="width:12px;height:12px;fill:#e8c874;" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
            label.textContent = 'Play';
            btn.setAttribute('aria-pressed', 'false');
          }
        }

        function playMusic() {
          const promise = audio.play();
          if (promise !== undefined) {
            promise.then(function() {
              setPlayingState(true);
            }).catch(function() {
              setPlayingState(false);
            });
          }
        }

        function toggleMusic() {
          if (audio.paused) {
            playMusic();
          } else {
            audio.pause();
            setPlayingState(false);
          }
        }

        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleMusic();
        });

        // Autoplay on first user interaction (clicking Open Invitation, touch, or click)
        function triggerFirstPlay() {
          if (audio.paused) {
            playMusic();
          }
          window.removeEventListener('click', triggerFirstPlay);
          window.removeEventListener('touchstart', triggerFirstPlay);
          window.removeEventListener('scroll', triggerFirstPlay);
        }

        window.addEventListener('click', triggerFirstPlay, { once: true });
        window.addEventListener('touchstart', triggerFirstPlay, { once: true });
        window.addEventListener('scroll', triggerFirstPlay, { once: true });

        // Initial attempt
        playMusic();
      })();
    </script>
  </body>
