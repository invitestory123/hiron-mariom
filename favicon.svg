<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .monogram-text {
        font-family: 'Times New Roman', 'Times', serif;
        font-weight: 700;
        fill: #ffffff;
      }
      .ampersand {
        font-family: 'Times New Roman', 'Times', serif;
        font-weight: 400;
        font-style: italic;
        fill: #dbeafe;
      }
    </style>
    <radialGradient id="navyGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#142a53" />
      <stop offset="70%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#061024" />
    </radialGradient>
  </defs>

  <!-- Navy Blue Background (Rounded Square) -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#navyGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="88" ry="88" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.25" />

  <!-- "H & M" in Caps with Times New Roman -->
  <!-- Groom Hiran: H -->
  <text x="145" y="315"
        text-anchor="middle"
        class="monogram-text"
        font-size="220"
        letter-spacing="-4">H</text>

  <!-- Ampersand & -->
  <text x="256" y="295"
        text-anchor="middle"
        class="ampersand"
        font-size="160">&amp;</text>

  <!-- Bride Mariom: M -->
  <text x="367" y="315"
        text-anchor="middle"
        class="monogram-text"
        font-size="220"
        letter-spacing="-4">M</text>
</svg>