<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Great+Vibes&amp;display=swap');
      .font-initials {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 700;
      }
      .font-amp {
        font-family: 'Great Vibes', cursive;
      }
    </style>

    <!-- Deep Royal Maroon Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b0c16" />
      <stop offset="55%" stop-color="#23060d" />
      <stop offset="100%" stop-color="#110206" />
    </radialGradient>

    <!-- Shimmering Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fdf3d6" />
      <stop offset="25%" stop-color="#e5b85c" />
      <stop offset="50%" stop-color="#fff8e7" />
      <stop offset="75%" stop-color="#c9922f" />
      <stop offset="100%" stop-color="#f5dc9e" />
    </linearGradient>

    <!-- Ring Gold Gradient -->
    <linearGradient id="ringGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b9832e" />
      <stop offset="30%" stop-color="#f6e2ae" />
      <stop offset="60%" stop-color="#d9a441" />
      <stop offset="100%" stop-color="#ffeec2" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#d9a441" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />

  <!-- Outer Double Gold Ring with Beaded Inset -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGold)" stroke-width="4" opacity="0.95" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGold)" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.75" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ringGold)" stroke-width="2.5" opacity="0.9" />

  <!-- Top Crown / Royal Crest -->
  <g transform="translate(256, 92)" filter="url(#shadow)">
    <!-- 8-point Royal Star -->
    <path d="M0 -22 L5 -7 L20 -7 L8 3 L12 18 L0 9 L-12 18 L-8 3 L-20 -7 L-5 -7 Z" fill="url(#goldGrad)" />
    <!-- Flanking Accent Beads -->
    <circle cx="-38" cy="-2" r="3" fill="url(#goldGrad)" opacity="0.85" />
    <circle cx="38" cy="-2" r="3" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M-65 -2 Q-35 -14 -18 -2" fill="none" stroke="url(#ringGold)" stroke-width="2" stroke-linecap="round" />
    <path d="M65 -2 Q35 -14 18 -2" fill="none" stroke="url(#ringGold)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Monogram Initials "H & M" -->
  <g filter="url(#shadow)">
    <!-- Groom Initial: H (Hiran) -->
    <text x="175" y="300"
          text-anchor="middle"
          fill="url(#goldGrad)"
          class="font-initials"
          font-size="168"
          letter-spacing="0">H</text>

    <!-- Elegant Ampersand: & -->
    <text x="256" y="278"
          text-anchor="middle"
          fill="url(#goldGrad)"
          class="font-amp"
          font-size="124"
          font-style="italic"
          opacity="0.95">&amp;</text>

    <!-- Bride Initial: M (Mariom) -->
    <text x="338" y="300"
          text-anchor="middle"
          fill="url(#goldGrad)"
          class="font-initials"
          font-size="168"
          letter-spacing="0">M</text>
  </g>

  <!-- Bottom Royal Laurel & Diamond -->
  <g transform="translate(256, 380)" filter="url(#shadow)">
    <!-- Center Faceted Diamond -->
    <path d="M0 -8 L8 0 L0 8 L-8 0 Z" fill="url(#goldGrad)" />
    <circle cx="-16" cy="0" r="2.5" fill="url(#goldGrad)" opacity="0.75" />
    <circle cx="16" cy="0" r="2.5" fill="url(#goldGrad)" opacity="0.75" />
    
    <!-- Left Laurel Wreath Branch -->
    <path d="M-22 0 C-60 -3 -105 12 -142 38" fill="none" stroke="url(#ringGold)" stroke-width="3" stroke-linecap="round" />
    <path d="M-45 2 C-52 -10 -64 -12 -70 -5 C-63 2 -52 6 -45 2 Z" fill="url(#goldGrad)" />
    <path d="M-85 12 C-93 2 -105 2 -108 10 C-100 16 -89 17 -85 12 Z" fill="url(#goldGrad)" />
    <path d="M-120 27 C-128 18 -138 20 -140 28 C-132 33 -123 32 -120 27 Z" fill="url(#goldGrad)" />

    <!-- Right Laurel Wreath Branch -->
    <path d="M22 0 C60 -3 105 12 142 38" fill="none" stroke="url(#ringGold)" stroke-width="3" stroke-linecap="round" />
    <path d="M45 2 C52 -10 64 -12 70 -5 C63 2 52 6 45 2 Z" fill="url(#goldGrad)" />
    <path d="M85 12 C93 2 105 2 108 10 C100 16 89 17 85 12 Z" fill="url(#goldGrad)" />
    <path d="M120 27 C128 18 138 20 140 28 C132 33 123 32 120 27 Z" fill="url(#goldGrad)" />
  </g>
</svg>